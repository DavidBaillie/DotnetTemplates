name: Test Template Configurations

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]
  workflow_dispatch:

jobs:
  test-template:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include-auth: [true, false]
        require-api-key: [true, false]
        
    name: Test (OS=${{ matrix.os }}, Auth=${{ matrix.include-auth }}, ApiKey=${{ matrix.require-api-key }})
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    - name: Setup Docker (for TestContainers)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y docker.io
        sudo systemctl start docker
        sudo systemctl enable docker
        sudo usermod -aG docker $USER
        
    - name: Install template
      run: dotnet new install ./MinimalApi
      
    - name: Create test directory
      shell: bash
      run: |
        mkdir -p ${{ runner.temp }}/test-project
        
    - name: Generate project from template
      working-directory: ${{ runner.temp }}/test-project
      run: |
        dotnet new minapi --name TestProject --includeAuth ${{ matrix.include-auth }} --requireApiKey ${{ matrix.require-api-key }}
        
    - name: Display generated files
      shell: bash
      working-directory: ${{ runner.temp }}/test-project
      run: |
        echo "Generated project structure:"
        ls -la
        
    - name: Restore dependencies
      working-directory: ${{ runner.temp }}/test-project
      run: dotnet restore
      
    - name: Build project
      working-directory: ${{ runner.temp }}/test-project
      run: dotnet build --no-restore --configuration Release
      
    - name: Run tests
      working-directory: ${{ runner.temp }}/test-project
      run: dotnet test --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx"
      
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.os }}-auth${{ matrix.include-auth }}-apikey${{ matrix.require-api-key }}
        path: ${{ runner.temp }}/test-project/**/test-results.trx
        
  test-summary:
    runs-on: ubuntu-latest
    needs: test-template
    if: always()
    steps:
    - name: Check test results
      run: |
        if [ "${{ needs.test-template.result }}" == "failure" ]; then
          echo "Some template tests failed"
          exit 1
        fi
        echo "All template tests passed!"
